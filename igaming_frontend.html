<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iGaming & Casino Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .active-tab { border-bottom: 3px solid #eab308; color: #eab308; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="pb-20">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-black text-amber-400 tracking-wider">BET<span class="text-white">PRO</span></span>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Multi Language Selector -->
            <select id="langSelect" onchange="changeLanguage()" class="bg-slate-800 text-xs text-amber-400 border border-slate-700 rounded-lg px-2 py-1 outline-none">
                <option value="en">🇬🇧 EN</option>
                <option value="bn" selected>🇧🇩 BN</option>
                <option value="hi">🇮🇳 HI</option>
                <option value="ur">🇵🇰 UR</option>
                <option value="ta">🇮🇳 TA</option>
            </select>

            <!-- Buttons -->
            <button onclick="openModal('loginModal')" class="bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-700 hover:bg-slate-700" data-i18n="login">লগইন</button>
            <button onclick="openModal('regModal')" class="bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-md hover:brightness-110 shadow-md" data-i18n="register">রেজিস্টার</button>
        </div>
    </header>

    <!-- Banner & Announcements -->
    <section class="p-4">
        <div class="w-full h-40 bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 rounded-2xl flex items-center justify-between p-6 border border-amber-500/30 relative overflow-hidden shadow-2xl">
            <div class="z-10 max-w-xs">
                <span class="bg-amber-500/20 text-amber-400 text-xs font-bold px-2 py-0.5 rounded-full border border-amber-500/40" data-i18n="vipBonus">VIP বোনাস</span>
                <h1 class="text-xl font-black mt-1 text-white leading-tight" data-i18n="bannerTitle">১০০% ওয়েলকাম বোনাস পান!</h1>
                <p class="text-xs text-slate-300 mt-1" data-i18n="bannerSub">প্রথম ডিপোজিটে পান ৫০০০ টাকা পর্যন্ত বোনাস</p>
            </div>
            <i class="fa-solid fa-gamepad text-8xl text-amber-500/10 absolute right-2 bottom-2"></i>
        </div>
    </section>

    <!-- Search & Filters -->
    <section class="px-4 mb-4">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" onkeyup="searchGames()" placeholder="গেম সার্চ করুন (যেমন: Crash, Slots)..." class="w-full bg-slate-800/80 text-sm pl-9 pr-4 py-2.5 rounded-xl border border-slate-700/60 focus:outline-none focus:border-amber-500 text-slate-200">
        </div>
    </section>

    <!-- Categories Tab -->
    <section class="px-4 mb-4 overflow-x-auto">
        <div class="flex space-x-4 border-b border-slate-800 text-sm font-semibold whitespace-nowrap">
            <button class="pb-2 active-tab" onclick="filterCategory('all')"><i class="fa-solid fa-border-all mr-1"></i> <span data-i18n="catAll">সব গেম</span></button>
            <button class="pb-2 text-slate-400 hover:text-white" onclick="filterCategory('slots')"><i class="fa-solid fa-dice-five mr-1"></i> <span data-i18n="catSlots">স্লট</span></button>
            <button class="pb-2 text-slate-400 hover:text-white" onclick="filterCategory('live')"><i class="fa-solid fa-headset mr-1"></i> <span data-i18n="catLive">লাইভ ক্যাসিনো</span></button>
            <button class="pb-2 text-slate-400 hover:text-white" onclick="filterCategory('crash')"><i class="fa-solid fa-rocket mr-1"></i> <span data-i18n="catCrash">ক্র্যাশ/এভিয়েটর</span></button>
            <button class="pb-2 text-slate-400 hover:text-white" onclick="filterCategory('table')"><i class="fa-solid fa-spade mr-1"></i> <span data-i18n="catTable">টেবিল গেম</span></button>
        </div>
    </section>

    <!-- Game Grid Section (150+ Games Target) -->
    <section class="px-4">
        <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
            <!-- Dynamically Rendered Games -->
        </div>
    </section>

    <!-- Bottom Navigation (Mobile Friendly) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 flex justify-around py-2 z-50 text-xs">
        <a href="#" class="flex flex-col items-center text-amber-400"><i class="fa-solid fa-house text-lg"></i><span>হোম</span></a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-trophy text-lg"></i><span>VIP</span></a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-wallet text-lg"></i><span>ওয়ালেট</span></a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-users text-lg"></i><span>রেফারেল</span></a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-user text-lg"></i><span>প্রোফাইল</span></a>
    </nav>

    <!-- Modal Mockups (Login) -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-6 relative">
            <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h2 class="text-xl font-bold text-amber-400 mb-4">অ্যাকাউন্টে লগইন করুন</h2>
            <form onsubmit="event.preventDefault(); alert('Login Success System Pending API');">
                <input type="text" placeholder="ইউজারনেম / ফোন নম্বর" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm mb-3 text-white">
                <input type="password" placeholder="পাসওয়ার্ড" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm mb-3 text-white">

                <!-- CAPTCHA Section -->
                <div class="flex items-center space-x-2 mb-4">
                    <div class="bg-slate-800 text-amber-400 font-mono px-3 py-2 rounded border border-slate-700 font-bold tracking-widest" id="captchaCode">7B9K</div>
                    <input type="text" placeholder="ক্যাপচা দিন" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white w-full">
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg transition">লগইন</button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Sample API Game Data Mock
        const sampleGames = [
            { name: "Aviator Crash", category: "crash", provider: "Spribe", img: "https://via.placeholder.com/150/1e293b/eab308?text=Aviator" },
            { name: "Gates of Olympus", category: "slots", provider: "Pragmatic", img: "https://via.placeholder.com/150/1e293b/eab308?text=Olympus" },
            { name: "Crazy Time", category: "live", provider: "Evolution", img: "https://via.placeholder.com/150/1e293b/eab308?text=CrazyTime" },
            { name: "Sweet Bonanza", category: "slots", provider: "Pragmatic", img: "https://via.placeholder.com/150/1e293b/eab308?text=Bonanza" },
            { name: "Lightning Roulette", category: "table", provider: "Evolution", img: "https://via.placeholder.com/150/1e293b/eab308?text=Roulette" },
            { name: "Dragon Tiger", category: "live", provider: "Ezugi", img: "https://via.placeholder.com/150/1e293b/eab308?text=DragonTiger" }
        ];

        function renderGames(games) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            games.forEach(g => {
                grid.innerHTML += `
                    <div class="glass-card border border-slate-800 rounded-xl overflow-hidden hover:border-amber-500/50 transition group cursor-pointer">
                        <div class="relative">
                            <img src="${g.img}" alt="${g.name}" class="w-full h-28 object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-1 left-1 bg-black/60 text-[9px] text-amber-400 px-1.5 py-0.5 rounded">${g.provider}</span>
                        </div>
                        <div class="p-2 text-center">
                            <h3 class="text-xs font-semibold text-slate-200 truncate">${g.name}</h3>
                            <button onclick="playGame('${g.name}')" class="mt-2 w-full bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-amber-400 text-[10px] py-1 rounded font-bold transition">খেলুন</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            if(cat === 'all') renderGames(sampleGames);
            else renderGames(sampleGames.filter(g => g.category === cat));
        }

        function searchGames() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            renderGames(sampleGames.filter(g => g.name.toLowerCase().includes(term)));
        }

        function playGame(gameName) {
            alert(`"${gameName}" গেমটির API রিকোয়েস্ট পাঠানো হচ্ছে... (লগইন প্রয়োজন)`);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // Initial Load
        renderGames(sampleGames);
    </script>
</body>
</html>
